<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f2ed">
  <title>Calendar Printer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #23332f;
      --muted: #66716c;
      --line: #d8ded9;
      --paper: #fff;
      --canvas: #f1f2ed;
      --green: #1c5b50;
      --green-dark: #14483f;
      --orange: #c36c4e;
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--canvas);
    }

    button, input { font: inherit; }

    .page-shell {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 0 25px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      display: grid;
      flex: 0 0 46px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font: 700 15px Georgia, serif;
    }

    .masthead h1, .controls-heading h2, .month-title {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
    }

    .masthead h1 {
      margin: 2px 0 0;
      font-size: 28px;
    }

    .masthead-note {
      margin: 0 0 0 auto;
      max-width: 270px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .eyebrow {
      margin: 0;
      color: var(--orange);
      font-size: 11px;
      font-weight: 700;
    }

    .controls {
      padding: 25px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .controls-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .controls-heading h2 {
      margin: 4px 0 0;
      font-size: 22px;
    }

    .calendar-form {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) minmax(140px, 0.55fr) auto;
      align-items: end;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid #bfc9c2;
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
      font-size: 15px;
    }

    .field input:focus-visible, button:focus-visible {
      outline: 3px solid #d99863;
      outline-offset: 2px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--green);
      border-radius: 4px;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--green-dark); }

    .print-button {
      min-height: 38px;
      padding: 8px 13px;
      border-color: #aab6ae;
      background: transparent;
      color: var(--ink);
    }

    .print-button:hover {
      border-color: var(--green);
      background: #e5ebe6;
      color: var(--green-dark);
    }

    .calendar-status {
      min-height: 18px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .calendar-sheet {
      --month-columns: 1;
      --month-rows: 1;
      display: grid;
      grid-auto-flow: column;
      grid-template-columns: repeat(var(--month-columns), minmax(0, 1fr));
      grid-template-rows: repeat(var(--month-rows), minmax(260px, auto));
      gap: 18px;
      margin-top: 24px;
    }

    .month-card {
      display: flex;
      min-width: 0;
      min-height: 260px;
      flex-direction: column;
      padding: 16px;
      border: 1px solid #d4dbd5;
      border-top: 3px solid var(--green);
      border-radius: 5px;
      background: var(--paper);
      box-shadow: 0 2px 7px rgb(35 51 47 / 5%);
    }

    .month-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 12px;
    }

    .month-title {
      margin: 0;
      font-size: 21px;
    }

    .month-index {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .weekday-row, .date-row {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekday-row {
      padding-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .date-rows {
      display: grid;
      flex: 1;
      grid-template-rows: repeat(var(--week-count), minmax(34px, 1fr));
    }

    .day-cell {
      min-width: 0;
      padding: 7px 6px;
      border-top: 1px solid #e3e7e3;
      border-left: 1px solid #e3e7e3;
      color: var(--ink);
      font-size: 13px;
      line-height: 1;
    }

    .date-row .day-cell:last-child { border-right: 1px solid #e3e7e3; }
    .date-row:last-child .day-cell { border-bottom: 1px solid #e3e7e3; }
    .day-cell.is-empty { background: #f7f8f5; }

    @media (max-width: 700px) {
      .page-shell { width: min(100% - 32px, 540px); padding-top: 22px; }
      .masthead { align-items: flex-start; gap: 12px; }
      .masthead h1 { font-size: 24px; }
      .masthead-note { display: none; }
      .calendar-form { grid-template-columns: 1fr 0.7fr; }
      .calendar-form button { grid-column: 1 / -1; }
      .calendar-sheet {
        grid-auto-flow: row;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: none;
        grid-auto-rows: minmax(260px, auto);
      }
    }

    @page {
      size: A4 portrait;
      margin: 10mm;
    }

    @media print {
      :root, body { background: #fff; }
      body { min-width: 0; margin: 0; }
      .page-shell { width: auto; margin: 0; padding: 0; }
      .screen-only { display: none !important; }
      .calendar-sheet {
        width: 100%;
        height: 277mm;
        margin: 0;
        gap: 4mm;
        grid-auto-flow: column;
        grid-template-columns: repeat(var(--month-columns), minmax(0, 1fr));
        grid-template-rows: repeat(var(--month-rows), minmax(0, 1fr));
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .month-card {
        min-height: 0;
        overflow: hidden;
        padding: 3mm;
        border: 0.25mm solid #222;
        border-top: 1mm solid #222;
        border-radius: 0;
        box-shadow: none;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .month-heading { margin-bottom: 2mm; }
      .month-title { font-size: 15pt; }
      .month-index { font-size: 8pt; }
      .weekday-row { padding-bottom: 1.5mm; font-size: 8pt; }
      .date-rows { grid-template-rows: repeat(var(--week-count), minmax(0, 1fr)); }
      .day-cell { padding: 1.5mm 1mm; font-size: 8pt; }
      .day-cell.is-empty { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="masthead screen-only">
      <div class="brand-mark" aria-hidden="true">CP</div>
      <div>
        <p class="eyebrow">Paper tools / 01</p>
        <h1>Calendar Printer</h1>
      </div>
      <p class="masthead-note">A few months at a time, arranged for the page.</p>
    </header>

    <main>
      <section class="controls screen-only" aria-labelledby="setup-title">
        <div class="controls-heading">
          <div>
            <p class="eyebrow">Set your range</p>
            <h2 id="setup-title">Choose your months</h2>
          </div>
          <button class="print-button" id="print-button" type="button">Print calendars</button>
        </div>

        <form class="calendar-form" id="calendar-form">
          <label class="field" for="start-month">
            <span>Starting month</span>
            <input id="start-month" name="start-month" type="month" required>
          </label>
          <label class="field" for="month-count">
            <span>Number of months</span>
            <input id="month-count" name="month-count" type="number" min="1" max="6" step="1" value="6" required>
          </label>
          <button type="submit">Generate calendars</button>
        </form>
        <p class="calendar-status" id="calendar-status" role="status" aria-live="polite"></p>
      </section>

      <section id="calendar-sheet" class="calendar-sheet" aria-label="Generated monthly calendars"></section>
    </main>
  </div>

  <script>
    const monthInput = document.getElementById('start-month');
    const countInput = document.getElementById('month-count');
    const calendarForm = document.getElementById('calendar-form');
    const calendarSheet = document.getElementById('calendar-sheet');
    const calendarStatus = document.getElementById('calendar-status');
    const weekdayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    function localDate(year, monthIndex, day) {
      const date = new Date(0);
      date.setHours(0, 0, 0, 0);
      date.setFullYear(year, monthIndex, day);
      return date;
    }

    function monthMarkup(date, index, total) {
      const year = date.getFullYear();
      const monthIndex = date.getMonth();
      const firstDay = localDate(year, monthIndex, 1);
      const weekdayOffset = (firstDay.getDay() + 6) % 7;
      const dayCount = localDate(year, monthIndex + 1, 0).getDate();
      const weekCount = Math.ceil((weekdayOffset + dayCount) / 7);
      const monthLabel = new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' }).format(firstDay);
      const weekdayHeaders = weekdayNames.map((weekday) => {
        return `<span role="columnheader" aria-label="${weekday}">${weekday.slice(0, 3)}</span>`;
      }).join('');

      const dateRows = Array.from({ length: weekCount }, (_, week) => {
        const cells = Array.from({ length: 7 }, (_, weekday) => {
          const day = week * 7 + weekday - weekdayOffset + 1;
          if (day < 1 || day > dayCount) {
            return '<span class="day-cell is-empty" role="gridcell" aria-hidden="true"></span>';
          }
          const currentDate = localDate(year, monthIndex, day);
          const accessibleDate = new Intl.DateTimeFormat(undefined, {
            weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
          }).format(currentDate);
          return `<span class="day-cell" role="gridcell" aria-label="${accessibleDate}">${day}</span>`;
        }).join('');
        return `<div class="date-row" role="row">${cells}</div>`;
      }).join('');

      return `<article class="month-card" aria-labelledby="month-title-${index}">
        <header class="month-heading">
          <h2 class="month-title" id="month-title-${index}">${monthLabel}</h2>
          <span class="month-index">${index + 1} / ${total}</span>
        </header>
        <div class="weekday-row" role="row">${weekdayHeaders}</div>
        <div class="date-rows" role="grid" aria-label="${monthLabel}" style="--week-count: ${weekCount}">${dateRows}</div>
      </article>`;
    }

    function generateCalendars() {
      const [startYear, startMonth] = monthInput.value.split('-').map(Number);
      const count = Number(countInput.value);
      if (!startYear || !startMonth || !Number.isInteger(count) || count < 1 || count > 6) {
        return;
      }

      const columns = count > 3 ? 2 : 1;
      const rows = Math.ceil(count / columns);
      calendarSheet.style.setProperty('--month-columns', columns);
      calendarSheet.style.setProperty('--month-rows', rows);
      calendarSheet.innerHTML = Array.from({ length: count }, (_, index) => {
        return monthMarkup(localDate(startYear, startMonth - 1 + index, 1), index, count);
      }).join('');

      const firstMonth = new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' })
        .format(localDate(startYear, startMonth - 1, 1));
      calendarStatus.textContent = `${count} ${count === 1 ? 'month' : 'months'} from ${firstMonth}. Read down each column, then continue at the next.`;
    }

    calendarForm.addEventListener('submit', (event) => {
      event.preventDefault();
      generateCalendars();
    });

    document.getElementById('print-button').addEventListener('click', () => window.print());

    const today = new Date();
    monthInput.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
    generateCalendars();
  </script>
</body>
</html>
